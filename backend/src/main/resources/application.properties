spring.application.name=backend

# ---------- Banco de dados (MySQL) ----------
# createDatabaseIfNotExist=true cria o banco "servicoja" sozinho na primeira execucao.
# Troque usuario e senha pelos do SEU MySQL (ou defina as variaveis DB_USER e DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servicoja?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Maceio}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:bddV1t0r14#}

# Cria/atualiza as tabelas a partir das classes do pacote model (somente em desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT (a chave precisa ter no minimo 32 caracteres) ----------
jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-com-pelo-menos-32-caracteres}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
